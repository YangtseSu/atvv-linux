version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
      timezone: "Asia/Shanghai"
    # No groups: every dependency version update gets its own pull request.
    open-pull-requests-limit: 50

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 50
