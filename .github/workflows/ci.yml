name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

# A newer push to the same ref makes the older run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # paths-filter compares against the previous commit on push.
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/**'

  test:
    needs: changes
    # Documentation-only changes skip the compile/test job; compliance still
    # runs so new files are checked by REUSE and cargo-deny.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev dbus libdbus-1-dev \
            pkg-config libgtk-4-dev libadwaita-1-dev librsvg2-dev xvfb
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: xvfb-run -a cargo test -p atvv-gui --test ui

  compliance:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: fsfe/reuse-action@v6
