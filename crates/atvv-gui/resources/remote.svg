<!-- Original vector illustration of the RC003 button layout, drawn from the
     device's visible controls; not a copied product photo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 820" width="320" height="820">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c7c9ce"/>
      <stop offset="0.18" stop-color="#e4e5e8"/>
      <stop offset="0.55" stop-color="#d3d5d9"/>
      <stop offset="1" stop-color="#aeb1b7"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35373b"/>
      <stop offset="1" stop-color="#202124"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303236"/>
      <stop offset="1" stop-color="#191a1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-5%" width="140%" height="112%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- body -->
  <rect x="48" y="10" width="224" height="800" rx="30" fill="#000000" opacity="0.16" transform="translate(0 4)"/>
  <rect x="48" y="8" width="224" height="800" rx="30" fill="url(#metal)" stroke="#989ba1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="58" y="20" width="204" height="776" rx="22" fill="none" stroke="#f2f3f5" stroke-width="1" opacity="0.55"/>

  <!-- power (top left) -->
  <circle cx="112" cy="74" r="24" fill="#d9dadd" stroke="#3b3d41" stroke-width="2.4"/>
  <circle cx="112" cy="75" r="8.5" fill="none" stroke="#3b3d41" stroke-width="2.2"/>
  <path d="M112 64 L112 74" stroke="#3b3d41" stroke-width="2.2" stroke-linecap="round"/>

  <!-- microphone / voice (top right, not remappable) -->
  <circle cx="208" cy="74" r="24" fill="#d9dadd" stroke="#3b3d41" stroke-width="2.4"/>
  <rect x="204" y="64" width="8" height="14" rx="4" fill="none" stroke="#3b3d41" stroke-width="2"/>
  <path d="M200 76 A8 8 0 0 0 216 76 M208 84 L208 88 M204 88 L212 88" fill="none" stroke="#3b3d41" stroke-width="1.8" stroke-linecap="round"/>

  <!-- circular navigation pad -->
  <circle cx="160" cy="230" r="104" fill="url(#pad)" stroke="#4c4e53" stroke-width="2"/>
  <circle cx="160" cy="230" r="78" fill="none" stroke="#3e4045" stroke-width="2"/>
  <circle cx="160" cy="230" r="56" fill="#1b1c1f" stroke="#3b3d42" stroke-width="2"/>
  <circle cx="160" cy="230" r="38" fill="#282a2e" stroke="#4d5055" stroke-width="1.5"/>
  <path d="M160 142 L154 152 L166 152 Z" fill="#777b82"/>
  <path d="M160 318 L154 308 L166 308 Z" fill="#777b82"/>
  <path d="M68 230 L78 224 L78 236 Z" fill="#777b82"/>
  <path d="M252 230 L242 224 L242 236 Z" fill="#777b82"/>

  <!-- back -->
  <circle cx="112" cy="370" r="28" fill="url(#key)" stroke="#424449" stroke-width="1.6"/>
  <path d="M118 360 L106 370 L118 380 M106 370 L124 370" fill="none" stroke="#eceef1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- home -->
  <circle cx="112" cy="442" r="28" fill="url(#key)" stroke="#424449" stroke-width="1.6"/>
  <path d="M112 429 L98 441 L103 441 L103 454 L121 454 L121 441 L126 441 Z" fill="none" stroke="#eceef1" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- menu -->
  <circle cx="112" cy="514" r="28" fill="url(#key)" stroke="#424449" stroke-width="1.6"/>
  <path d="M100 504 L124 504 M100 514 L124 514 M100 524 L124 524" stroke="#eceef1" stroke-width="2.2" stroke-linecap="round"/>

  <!-- volume rocker -->
  <rect x="178" y="346" width="64" height="112" rx="32" fill="url(#key)" stroke="#424449" stroke-width="1.6"/>
  <path d="M178 402 L242 402" stroke="#111214" stroke-width="2"/>
  <path d="M201 374 L219 374 M210 365 L210 383" stroke="#eceef1" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M201 430 L219 430" stroke="#eceef1" stroke-width="2.4" stroke-linecap="round"/>

  <!-- TV -->
  <circle cx="210" cy="514" r="28" fill="url(#key)" stroke="#424449" stroke-width="1.6"/>
  <rect x="199" y="505" width="22" height="15" rx="2.5" fill="none" stroke="#eceef1" stroke-width="2"/>
  <path d="M206 525 L208 520 M214 525 L212 520" stroke="#eceef1" stroke-width="2" stroke-linecap="round"/>

  <!-- NFC coil and model mark -->
  <path d="M150 650 Q 160 656 150 664 M156 646 Q 170 656 156 668 M162 644 Q 178 656 162 672" fill="none" stroke="#7c7f85" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="146" cy="657" r="1.8" fill="#7c7f85"/>
  <text x="160" y="724" text-anchor="middle" font-family="sans-serif" font-size="13" letter-spacing="3" fill="#777a80">RC003</text>
</svg>
