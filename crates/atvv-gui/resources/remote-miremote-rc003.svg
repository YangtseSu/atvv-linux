<!-- Original vector illustration of the RC003 button layout, drawn from the
     device's visible controls; not a copied product photo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 950" width="320" height="950">
  <defs>
    <linearGradient id="body-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b8e92"/>
      <stop offset="0.035" stop-color="#c4c6ca"/>
      <stop offset="0.10" stop-color="#e6e7ea"/>
      <stop offset="0.30" stop-color="#dbdde0"/>
      <stop offset="0.66" stop-color="#cfd1d4"/>
      <stop offset="0.90" stop-color="#bfc2c6"/>
      <stop offset="0.97" stop-color="#a5a8ad"/>
      <stop offset="1" stop-color="#7f8286"/>
    </linearGradient>
    <linearGradient id="face-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e3e6"/>
      <stop offset="0.16" stop-color="#d8dadd"/>
      <stop offset="0.72" stop-color="#d0d2d5"/>
      <stop offset="1" stop-color="#c6c8cc"/>
    </linearGradient>
    <linearGradient id="top-key" x1="0.15" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#e9eaec"/>
      <stop offset="0.5" stop-color="#dcdee1"/>
      <stop offset="1" stop-color="#ccced2"/>
    </linearGradient>
    <linearGradient id="key-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b4c50"/>
      <stop offset="0.16" stop-color="#3e3f43"/>
      <stop offset="0.82" stop-color="#313236"/>
      <stop offset="1" stop-color="#2a2b2e"/>
    </linearGradient>
    <linearGradient id="rocker-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c4d51"/>
      <stop offset="0.40" stop-color="#3b3c40"/>
      <stop offset="0.52" stop-color="#333438"/>
      <stop offset="0.74" stop-color="#2f3034"/>
      <stop offset="1" stop-color="#28292c"/>
    </linearGradient>
    <radialGradient id="pad-face" cx="0.44" cy="0.36" r="0.78">
      <stop offset="0" stop-color="#404145"/>
      <stop offset="0.66" stop-color="#36373b"/>
      <stop offset="1" stop-color="#292a2d"/>
    </radialGradient>
    <radialGradient id="pad-inner" cx="0.42" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#3e3f43"/>
      <stop offset="1" stop-color="#303135"/>
    </radialGradient>
    <filter id="body-shadow" x="-15%" y="-4%" width="130%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.20"/>
    </filter>
    <clipPath id="nfc-clip">
      <rect x="150.5" y="687" width="19" height="20" rx="2.4"/>
    </clipPath>
  </defs>

  <!-- body -->
  <rect x="48" y="8" width="224" height="922" rx="10" fill="url(#body-metal)" stroke="#85888d" stroke-width="1" filter="url(#body-shadow)"/>
  <rect x="50.5" y="10.5" width="219" height="917" rx="8" fill="url(#face-metal)"/>
  <rect x="51.5" y="11.5" width="217" height="915" rx="7.2" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1"/>

  <!-- power -->
  <circle cx="101.3" cy="64.8" r="25.5" fill="url(#top-key)" stroke="#7f8287" stroke-width="1.2"/>
  <circle cx="101.3" cy="64.8" r="24.1" fill="none" stroke="#ffffff" stroke-opacity="0.40" stroke-width="0.9"/>
  <g fill="none" stroke="#55575b" stroke-width="1.8" stroke-linecap="round">
    <path d="M97.2 59.0 A7.2 7.2 0 1 0 105.4 59.0"/>
    <path d="M101.3 54.6 L101.3 64.0"/>
  </g>

  <!-- voice / microphone -->
  <circle cx="218.7" cy="64.8" r="25.5" fill="url(#top-key)" stroke="#7f8287" stroke-width="1.2"/>
  <circle cx="218.7" cy="64.8" r="24.1" fill="none" stroke="#ffffff" stroke-opacity="0.40" stroke-width="0.9"/>
  <g fill="none" stroke="#55575b" stroke-linecap="round">
    <rect x="214.8" y="54.5" width="7.8" height="11.6" rx="3.9" stroke-width="1.8"/>
    <path d="M212.1 63.0 A6.6 6.6 0 0 0 225.3 63.0" stroke-width="1.7"/>
    <path d="M218.7 69.6 L218.7 73.2" stroke-width="1.7"/>
  </g>

  <!-- navigation pad -->
  <circle cx="160" cy="201" r="93.5" fill="url(#pad-face)" stroke="#1d1e21" stroke-width="1.6"/>
  <circle cx="160" cy="201" r="91.6" fill="none" stroke="#4f5055" stroke-width="1" opacity="0.55"/>
  <circle cx="160" cy="201" r="48.2" fill="none" stroke="#151619" stroke-width="2"/>
  <circle cx="160" cy="201" r="46.8" fill="url(#pad-inner)"/>
  <path d="M119.5 185.8 A46 46 0 0 1 200.5 185.8" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.4"/>
  <g fill="#787a7f" opacity="0.75">
    <rect x="159.1" y="110.8" width="1.8" height="4.4" rx="0.9"/>
    <rect x="159.1" y="286.8" width="1.8" height="4.4" rx="0.9"/>
    <rect x="70.8" y="200.1" width="4.4" height="1.8" rx="0.9"/>
    <rect x="244.8" y="200.1" width="4.4" height="1.8" rx="0.9"/>
  </g>

  <!-- back -->
  <circle cx="113.3" cy="340" r="37.4" fill="url(#key-face)" stroke="#16171a" stroke-width="1.5"/>
  <path d="M119.6 329.7 L106.3 340 L119.6 350.3" fill="none" stroke="#e8e9eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- home -->
  <circle cx="113.3" cy="425.2" r="37.4" fill="url(#key-face)" stroke="#16171a" stroke-width="1.5"/>
  <path d="M104.4 426.0 L113.3 415.8 L122.2 426.0 L122.2 435.8 L104.4 435.8 Z" fill="none" stroke="#e8e9eb" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- menu -->
  <circle cx="113.3" cy="511.7" r="37.4" fill="url(#key-face)" stroke="#16171a" stroke-width="1.5"/>
  <path d="M103.2 504.2 H123.4 M103.2 511.7 H123.4 M103.2 519.2 H123.4" fill="none" stroke="#e8e9eb" stroke-width="2.2" stroke-linecap="round"/>

  <!-- volume rocker -->
  <rect x="169.9" y="302.5" width="74.5" height="161.2" rx="37.25" fill="url(#rocker-face)" stroke="#16171a" stroke-width="1.5"/>
  <path d="M175.8 383.4 Q207.2 381.2 238.5 383.4" fill="none" stroke="#191a1d" stroke-width="1.7" opacity="0.55"/>
  <path d="M175.8 381.8 Q207.2 379.7 238.5 381.8" fill="none" stroke="#ffffff" stroke-width="0.9" opacity="0.06"/>
  <path d="M197.2 339.0 H217.2 M207.2 329.0 V349.0" fill="none" stroke="#e8e9eb" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M197.2 425.1 H217.2" fill="none" stroke="#e8e9eb" stroke-width="2.4" stroke-linecap="round"/>

  <!-- TV -->
  <circle cx="206.2" cy="512.3" r="37.4" fill="url(#key-face)" stroke="#16171a" stroke-width="1.5"/>
  <g fill="none" stroke="#e8e9eb" stroke-linecap="round" stroke-linejoin="round">
    <rect x="193.5" y="501.7" width="25.4" height="21.0" rx="4.2" stroke-width="2"/>
    <path d="M198.9 507.2 H204.9 M201.9 507.2 V516.9" stroke-width="1.9"/>
    <path d="M207.4 507.2 L210.4 516.9 L213.4 507.2" stroke-width="1.9"/>
  </g>

  <!-- NFC mark -->
  <rect x="150.5" y="687" width="19" height="20" rx="2.4" fill="#4a4b4f"/>
  <g clip-path="url(#nfc-clip)" stroke="#d3d5d8" stroke-width="1.5" stroke-linecap="round">
    <path d="M152.4 689 L161.5 705"/>
    <path d="M157.4 689 L166.5 705"/>
  </g>

  <!-- wordmark -->
  <text x="160" y="861" text-anchor="middle" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="23" font-weight="600" letter-spacing="0.4" fill="#4c4d51">xiaomi</text>
</svg>
