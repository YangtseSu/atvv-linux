# cargo-deny configuration.
#
# The license allow-list is the gate: a crate is accepted only when its SPDX
# expression can be satisfied by one of these licenses. GPL-3.0-only is
# deliberately absent; accepting it requires relicensing the whole work (ADR
# 0003). LGPL-2.1-or-later appears only as an alternative in a crate that is
# also MIT/Apache-2.0, and is satisfied by the MIT branch. 0BSD covers
# `evdevil` and its `uoctl` dependency (ADR 0006).
[graph]
all-features = false
no-default-features = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
