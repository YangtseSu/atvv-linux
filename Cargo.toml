[workspace]
resolver = "3"
members = [
    "crates/atvv-protocol",
    "crates/atvv-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/YangtseSu/atvv-linux"
authors = ["Yangtse Su <yangtsesu@gmail.com>"]

[workspace.dependencies]
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
