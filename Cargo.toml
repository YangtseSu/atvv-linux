[workspace]
resolver = "3"
members = [
    "crates/atvv-protocol",
    "crates/atvv-audio",
    "crates/atvv-input",
    "crates/atvv-daemon",
    "crates/atvv-cli",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# zbus 5 requires 1.87.
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/YangtseSu/atvv-linux"
authors = ["Yangtse Su <yangtsesu@gmail.com>"]

[workspace.dependencies]
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
pipewire = "0.10"
crossbeam-queue = "0.3"
evdev = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
zbus = "5.19"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
