[workspace]
resolver = "3"
members = [
    "crates/atvv-protocol",
    "crates/atvv-audio",
    "crates/atvv-input",
    "crates/atvv-bluez",
    "crates/atvv-daemon",
    "crates/atvv-cli",
    "crates/atvv-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# zbus 5 requires 1.87.
rust-version = "1.87"
license = "GPL-3.0-or-later"
repository = "https://github.com/YangtseSu/atvv-linux"
authors = ["Yangtse Su <yangtsesu@gmail.com>"]

[workspace.dependencies]
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
clap_mangen = "0.3"
bluer = { version = "0.17", features = ["bluetoothd"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
pipewire = "0.10"
crossbeam-queue = "0.3"
evdevil = "=0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
zbus = "5.19"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
